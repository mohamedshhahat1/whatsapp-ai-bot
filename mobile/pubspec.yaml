name: whatsapp_ai_mobile
description: WhatsApp AI Bot management app for operators.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Network
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # Storage
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Routing
  go_router: ^14.2.7

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # UI / Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_slidable: ^3.1.1
  pull_down_button: ^0.10.1

  # Utils
  # Must stay compatible with the intl version pinned by
  # flutter_localizations in the Flutter SDK (0.20.2 on current channels).
  intl: ^0.20.2
  collection: ^1.18.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Vibration (for sales lead alerts)
  vibration: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  # custom_lint / riverpod_lint intentionally omitted.
  # custom_lint 0.6.x pulls analyzer ^6.6.0, and analyzer >=6.6.0 <7.3.0
  # requires the _macros package that no longer ships with the Dart SDK,
  # which makes `flutter pub get` fail. They only add optional lint rules
  # and are not needed to build or to run code generation.

flutter:
  uses-material-design: true
  generate: true
