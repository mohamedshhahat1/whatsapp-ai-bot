services:
  # One-shot schema upgrade. app and worker wait for this to exit 0, so a
  # container can never serve traffic against a database that has not been
  # migrated. Running migrations from the app's own entrypoint instead would
  # race across replicas.
  migrate:
    build: .
    command: alembic upgrade head
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/whatsapp_ai_bot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/whatsapp_ai_bot
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Knowledge sources, so `python scripts/ingest_knowledge.py` can read
      # them inside the container without rebuilding the image.
      - ./knowledge:/app/knowledge:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Readiness, not liveness: this is what decides whether the container is
    # actually able to serve, so it checks Postgres and Redis too.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    build: .
    # threads pool: I/O-bound tasks + single process so Prometheus metrics
    # from all tasks are exposed on one port.
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --pool=threads --concurrency=8 -Q webhooks
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/whatsapp_ai_bot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # `inspect ping` round-trips through the broker to this specific worker,
    # so it fails if the process is alive but has lost its broker connection
    # or deadlocked its pool -- the failure modes that silently stop message
    # processing while the container still looks up.
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # The scheduler. Emits conversations.close_idle_sessions once a minute onto
  # the webhooks queue, where the worker above picks it up.
  #
  # This container is REQUIRED for the conversation session lifecycle. Without
  # it, sessions are still opened, greeted, tracked and reset correctly -- and
  # nothing ever closes them, so no closing message is ever sent and every
  # conversation stays open forever. That failure is silent: the app is
  # healthy, the worker is healthy, and only the absence of goodbyes shows it.
  #
  # Exactly ONE replica, ever. Two schedulers means two ticks a minute; the
  # claim in ConversationRepository.claim_idle_sessions keeps that correct, so
  # the cost is wasted queries rather than duplicate messages -- but there is
  # no reason to pay it. Do not scale this service.
  #
  # The schedule file goes in /tmp because the image runs as a non-root user
  # and beat writes it on every sync; the default location is the working
  # directory, which is not writable. It holds only the last-run timestamp, so
  # losing it on restart costs at most one extra sweep.
  beat:
    build: .
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/whatsapp_ai_bot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No healthcheck: beat answers no inspect ping and serves no port, so
    # there is nothing to probe that would not simply restate "the process is
    # running", which Docker already knows. Monitor it from the other end
    # instead -- the session_sweep_completed log line, or an alert on active
    # conversations older than the idle timeout.
    restart: unless-stopped

  db:
    # Postgres 16 + the pgvector extension used by the knowledge base.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatsapp_ai_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
      - worker
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    profiles: ["production"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
