# Shared TLS parameters, tracking the Mozilla "intermediate" profile.
#
# Included from the 443 server block. Kept separate from the server template
# so it is not run through envsubst and so a cipher change is one diff in one
# file rather than a hunt through the proxy configuration.

# TLS 1.2 and 1.3 only. 1.0 and 1.1 are deprecated by RFC 8996 and rejected
# outright by the PCI DSS; Meta's webhook client speaks 1.2 and 1.3.
ssl_protocols TLSv1.2 TLSv1.3;

# With TLS 1.3 the client's preference order is the sane one, and the 1.2
# suites below are already ordered strongest-first. Forcing server preference
# only helps when the server list is the better ordered of the two.
ssl_prefer_server_ciphers off;

# Forward secrecy and AEAD only: every suite here is ECDHE or DHE, and every
# one is GCM or ChaCha20-Poly1305. No CBC, no RSA key exchange, no 3DES, no
# RC4, no export or NULL suites.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;

ssl_ecdh_curve X25519:prime256v1:secp384r1;

# Required by the DHE suites above. Written by scripts/init-letsencrypt.sh.
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;

# Session tickets without rotation are a forward-secrecy hole: one stolen
# ticket key decrypts every resumed session for the life of the process.
ssl_session_tickets off;

# OCSP stapling. ssl_trusted_certificate (the issuer chain) is set per server
# block; without it stapling silently does nothing.
ssl_stapling on;
ssl_stapling_verify on;

# Docker's embedded DNS. nginx needs a resolver to reach the OCSP responder,
# and refuses to start with `resolver` unset if stapling has to look one up.
resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 5s;
