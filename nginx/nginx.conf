upstream whatsapp_ai_bot {
    server app:8000;
}

# WebSocket upgrades need Connection: upgrade passed through, but the same
# header must be "close" for ordinary requests, so it cannot be hard-coded.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Prometheus metrics are never reachable from outside. Prometheus scrapes
    # app:8000/metrics directly over the private compose network; the app also
    # enforces this itself (see require_metrics_access) -- this is the outer of
    # the two layers. 404 rather than 403 so the endpoint's existence is not
    # advertised.
    location /metrics {
        return 404;
    }

    # The dashboard's realtime event stream. Long-lived by design, so the
    # default 60s read timeout would drop it roughly every minute; the app
    # sends a heartbeat every 20s, well inside this window.
    location /ws/ {
        proxy_pass http://whatsapp_ai_bot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://whatsapp_ai_bot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
