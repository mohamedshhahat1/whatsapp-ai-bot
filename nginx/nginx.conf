# RETIRED -- this file is not used by any deployment.
#
# It is kept only so that anyone who remembers it, or finds it in an old
# runbook, is told where the real configuration went instead of editing this
# and wondering why nothing changed.
#
# The live configuration is templated, because it needs the domain name
# substituted at container start for the certificate paths and server_name:
#
#   nginx/templates/default.conf.template   the server blocks (80 and 443)
#   nginx/tls.conf                          protocols, ciphers, OCSP, dhparam
#   nginx/security-headers.conf             HSTS, CSP and the rest
#
# The nginx:1.27-alpine image runs envsubst over everything in
# /etc/nginx/templates at startup, which is why the template lives there and
# this file is mounted nowhere.
#
# See docs/DEPLOYMENT.md, section "TLS".
