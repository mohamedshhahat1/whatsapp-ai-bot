# Response headers applied to every HTTPS response.
#
# Included at BOTH the server level and inside each location. This looks
# redundant and is not: nginx does not merge add_header across configuration
# levels. A location that issues any add_header of its own silently discards
# every header inherited from the server block. Including the same file in
# both places means each response carries exactly one copy and no location can
# accidentally drop the set.
#
# `always` makes the headers apply to error responses too -- a 401 from the
# admin API or a 404 from /metrics is exactly when you want framing and sniffing
# protection, and without `always` nginx omits them on anything that is not 2xx
# or 3xx.

# Two years, subdomains included, and preload-eligible. Only ever sent over
# TLS: this file is included from the 443 server block only, because a browser
# ignores HSTS received over plain HTTP and sending it there just invites a
# stripping attack to look successful.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# The dashboard is never legitimately framed, so DENY rather than SAMEORIGIN.
# frame-ancestors in the CSP below says the same thing to modern browsers;
# this covers the ones that only understand the old header.
add_header X-Frame-Options "DENY" always;

add_header X-Content-Type-Options "nosniff" always;

# Send the origin cross-site, the full URL same-site. Conversation URLs carry
# database ids, which should not leak to any third party in a Referer.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The dashboard uses none of these. Denying them all means a compromised
# dependency cannot quietly ask for the operator's camera or location.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

# The dashboard is a Vite-built SPA served from the same origin as the API.
#
# 'unsafe-inline' is present for style-src only, because the bundler emits
# inline style attributes; script-src has no such escape hatch, which is the
# half that matters for XSS.
#
# connect-src includes wss: for the realtime event stream. object-src and
# frame-ancestors are 'none' -- there are no plugins and no framing.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests" always;

# Cross-origin isolation: keeps the dashboard's browsing context out of reach
# of anything it opens or that opens it.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
