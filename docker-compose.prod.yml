# Production stack: no .env file -- every credential is a Docker secret.
#
#   ./scripts/init-secrets.sh                       # create ./secrets/* once
#   export DOMAIN=bot.example.com CERTBOT_EMAIL=ops@example.com
#   ./scripts/init-letsencrypt.sh                   # obtain the certificate
#   docker compose -f docker-compose.prod.yml up -d
#
# Secrets are mounted read-only at /run/secrets/<name>; pydantic-settings loads
# files whose name matches a settings field automatically (SECRETS_DIR).
# On Docker Swarm, replace each `file:` entry with `external: true` and manage
# the values with `docker secret create <name> -`.
#
# Schema upgrades run in the one-shot `migrate` service before app and worker
# start; no manual `alembic upgrade head` step is required on deploy.
#
# THREE PROCESSES run the application: `app` serves HTTP, `worker` consumes the
# queue, and `beat` emits the scheduled ticks. All three are required. Dropping
# beat does not break anything visibly -- it removes the idle-session sweep,
# the closing message, the re-welcome that depends on a session having ended,
# the operator-session purge and audit retention, while every container keeps
# reporting healthy.
#
# DOMAIN is required. nginx renders its config from it and Let's Encrypt
# issues against it, so a stack started without it would serve a certificate
# for the wrong name -- failing loudly here beats failing at the TLS handshake.
#
# ALERTING CREDENTIALS are Docker secrets like everything else. This used to be
# the one exception, on the grounds that Alertmanager has no environment
# expansion of its own -- but it supports the *_file form for all three
# credentials in use (SMTP password, Slack webhook URL, Telegram bot token), so
# Alertmanager reads them straight from /run/secrets and they are never
# rendered into the config file or passed through the init container's
# environment. Non-secret alerting settings -- hosts, ports, channels,
# recipients -- remain ordinary variables. See docs/ALERTING.md.

x-app-environment: &app-environment
  ENVIRONMENT: production
  DEBUG: "false"
  SECRETS_DIR: /run/secrets
  # No credentials here. The redis_password secret is mounted at
  # /run/secrets/redis_password and pydantic-settings maps it onto the
  # redis_password field, which app/config.py merges into this URL along with
  # every derived Celery URL. Writing the password into REDIS_URL instead
  # would put it in `docker inspect` output for three services.
  REDIS_URL: redis://redis:6379/0
  # Set to "true" only when Redis is reached across a network the compose
  # bridge does not cover -- a managed instance or a separate host. In-stack
  # traffic never leaves the Docker network, so TLS here is pure overhead.
  REDIS_TLS: "${REDIS_TLS:-false}"
  USE_TASK_QUEUE: "true"
  RATE_LIMIT_ENABLED: "true"
  # nginx is the only proxy in front of the app, so the real client IP is the
  # last X-Forwarded-For entry. Raise this if you add a CDN or load balancer,
  # or rate limiting can be bypassed with a forged header.
  TRUSTED_PROXY_HOPS: "1"
  METRICS_ENABLED: "true"
  OPENAI_MODEL: gpt-4.1-mini
  WHATSAPP_API_VERSION: v21.0
  RAG_ENABLED: "true"
  KNOWLEDGE_DIR: /app/knowledge
  # --- Per-customer quotas and spend protection (app/core/quota.py) --------
  # The webhook endpoint limit is a crude DoS backstop only: every delivery
  # arrives from Meta's addresses, so it is one shared bucket by construction
  # and throttling it drops other customers' messages too. Real isolation is
  # per-wa_id, below.
  CUSTOMER_RATE_LIMIT_ENABLED: "true"
  CUSTOMER_LIMIT_PER_MINUTE: "12"
  CUSTOMER_LIMIT_PER_HOUR: "120"
  CUSTOMER_LIMIT_PER_DAY: "400"
  # The cost ceiling. Set DAILY_SPEND_LIMIT_USD to a number you would be
  # content to lose to a scripted flood -- past it the assistant stops
  # answering everyone and customers are routed to a person.
  SPEND_GUARD_ENABLED: "true"
  DAILY_SPEND_LIMIT_USD: "${DAILY_SPEND_LIMIT_USD:-25}"
  DAILY_TOKEN_LIMIT: "${DAILY_TOKEN_LIMIT:-5000000}"
  # Must stay below the worker's stop_grace_period.
  CELERY_TASK_TIME_LIMIT: "300"
  CELERY_TASK_SOFT_TIME_LIMIT: "240"
  CELERY_VISIBILITY_TIMEOUT: "900"
  # --- Inbound freshness (app/core/inbound_config.py) ----------------------
  # Meta retries an undelivered webhook for hours. Without this gate, a
  # message the bot never managed to process is answered whenever the retry
  # finally lands -- which is how a customer received a welcome and a menu
  # forty minutes after saying goodbye. A delivery older than the bound is
  # recorded so the dashboard still shows it, but nothing is sent.
  #
  # MUST stay below CONVERSATION_REOPEN_WINDOW_MINUTES (30). Above it, a stale
  # delivery can arrive after the window has closed, which starts a brand new
  # session and re-sends the welcome -- exactly the bug this prevents.
  REJECT_STALE_INBOUND: "${REJECT_STALE_INBOUND:-true}"
  INBOUND_MAX_AGE_MINUTES: "${INBOUND_MAX_AGE_MINUTES:-10}"
  # --- Mobile push notifications (docs/PUSH_NOTIFICATIONS.md) --------------
  # Off by default, and the fcm_credentials secret is an empty placeholder
  # until you paste the service-account JSON in, so the two defaults agree:
  # nothing is sent and nothing errors. Enable both together.
  #
  # No FCM_CREDENTIALS_FILE here on purpose -- the secret mounted at
  # /run/secrets/fcm_credentials is picked up by name like the other eight.
  #
  # FCM_PROJECT_ID is the STRING project ID from Project settings -> General
  # (e.g. alkayan-bot-4f21), not the project number and not the Sender ID.
  # A wrong value is not caught at start-up; it fails with a 404 on every
  # single send.
  PUSH_ENABLED: "${PUSH_ENABLED:-false}"
  FCM_PROJECT_ID: "${FCM_PROJECT_ID:-}"
  # Must match the channel the Android app creates, or Android accepts the
  # notification and silently shows nothing.
  PUSH_ANDROID_CHANNEL: "${PUSH_ANDROID_CHANNEL:-whatsapp_ai_bot_alerts}"

x-app-secrets: &app-secrets
  - database_url
  - redis_password
  - openai_api_key
  - whatsapp_token
  - whatsapp_phone_number_id
  - whatsapp_verify_token
  - whatsapp_app_secret
  - admin_api_key
  # Notifications are dispatched from events.publish, which runs in the worker
  # for queued webhook work as well as in the API process -- so this belongs on
  # the shared anchor, not on `app` alone. On `app` only, operator actions
  # would notify and incoming customer messages would not.
  - fcm_credentials

services:
  migrate:
    image: ${APP_IMAGE:-ghcr.io/mohamedshhahat1/whatsapp-ai-bot:latest}
    command: alembic upgrade head
    environment: *app-environment
    secrets: *app-secrets
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${APP_IMAGE:-ghcr.io/mohamedshhahat1/whatsapp-ai-bot:latest}
    environment: *app-environment
    secrets: *app-secrets
    volumes:
      # Company documents live on the host, never inside the image.
      - ./knowledge:/app/knowledge:ro
    expose:
      - "8000"
    ports:
      # Loopback only. Public traffic reaches the app through nginx over TLS;
      # binding 0.0.0.0 here would expose an unencrypted copy of the entire
      # API alongside the HTTPS one and quietly undo the TLS work.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Long enough for in-flight HTTP requests to finish. The API hands webhook
    # work to the queue, so its requests are short.
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    image: ${APP_IMAGE:-ghcr.io/mohamedshhahat1/whatsapp-ai-bot:latest}
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --pool=threads --concurrency=8 -Q webhooks
    environment: *app-environment
    secrets: *app-secrets
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    # THE deploy-safety setting. On SIGTERM Celery stops accepting work and
    # drains what it is holding; Docker's default 10s SIGKILLs it long before
    # a task that is mid-completion can finish. With task_acks_late that kill
    # means redelivery, and redelivery after a WhatsApp send is a duplicate
    # reply and a second OpenAI charge.
    #
    # Must exceed CELERY_TASK_TIME_LIMIT (300s) so even a task being killed by
    # its own hard limit has time to unwind. Keep the two in step.
    stop_grace_period: 330s
    restart: unless-stopped

  beat:
    # The scheduler. Emits the ticks defined in celery_app.py's beat_schedule:
    # the idle-session sweep every 60s, the operator-session purge hourly and
    # the audit-log purge daily. It executes nothing itself -- every tick is a
    # message onto the webhooks queue that `worker` picks up.
    #
    # Without this service the stack looks completely healthy and quietly does
    # none of that. Sessions open, get greeted and are tracked, and then never
    # close: no goodbye is sent, and since a session that never ends never
    # releases the customer's slot in uq_active_conversation_per_user, the
    # welcome never fires a second time either.
    image: ${APP_IMAGE:-ghcr.io/mohamedshhahat1/whatsapp-ai-bot:latest}
    # --schedule is set explicitly because the default writes
    # celerybeat-schedule into the working directory, which is /app here --
    # application state inside the code directory of a disposable container.
    # Losing the file on restart is fine: the schedule itself comes from
    # celery_app.py and this only records when each task last ran.
    command: >-
      celery -A app.workers.celery_app.celery_app beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    environment: *app-environment
    secrets: *app-secrets
    # EXACTLY ONE. Two schedulers emit two ticks for every scheduled task. The
    # conditional claim in ConversationRepository.claim_idle_sessions makes
    # that harmless for correctness -- nobody is told goodbye twice -- so the
    # symptom is not a visible bug but a silently doubled query load against
    # the conversations table. Do not `docker compose up --scale beat=2`.
    deploy:
      replicas: 1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Beat has no inspect endpoint -- `celery inspect ping` answers for
      # workers only -- so this reads the age of the schedule file instead.
      # PersistentScheduler rewrites it every few minutes, so a stale file
      # means the scheduler is wedged rather than merely idle, which is
      # exactly the failure worth catching. A liveness check would not: a beat
      # process can be alive and emitting nothing.
      #
      # The glob matters. shelve appends a backend-dependent suffix to the
      # filename, so matching /tmp/celerybeat-schedule exactly would work on
      # one base image and silently never match on another.
      test:
        - CMD
        - python
        - -c
        - import glob, os, sys, time; f = glob.glob('/tmp/celerybeat-schedule*'); sys.exit(0 if f and time.time() - max(os.path.getmtime(p) for p in f) < 900 else 1)
      interval: 60s
      timeout: 10s
      retries: 3
      # Generous: the file is not written until the first sync, which is
      # several minutes after start-up.
      start_period: 300s
    # 30s, not the worker's 330s. Beat holds no tasks -- it emits ticks and
    # forgets them -- so there is nothing to drain and a long grace period
    # would only make every deploy slower.
    stop_grace_period: 30s
    restart: unless-stopped

  db:
    # Postgres 16 + pgvector (required by the knowledge-base migration).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: whatsapp_ai_bot
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Postgres needs to finish its shutdown checkpoint. Killed mid-checkpoint
    # it recovers on next start, but recovery is slower than a clean stop and
    # happens while customers are waiting.
    stop_grace_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Renders requirepass and the two ACL users into a tmpfs file from the
    # Docker secrets, then starts Redis with the checked-in config, which ends
    # with `include /run/redis/auth.conf`.
    #
    # --requirepass on the command line would put the password into `ps` inside
    # the container and `docker inspect` outside it; an env var would put it in
    # `docker inspect` too. This way it exists only in the secret mount and in
    # a root-only file on a tmpfs that never touches disk.
    #
    # `default` gets full access for the application. `exporter` is limited to
    # the handful of read-only commands redis_exporter issues, so a compromised
    # metrics container cannot touch the quota, spend or idempotency keys.
    command:
      - /bin/sh
      - -c
      - |
        set -e
        umask 077
        mkdir -p /run/redis
        REDIS_PW="$$(cat /run/secrets/redis_password)"
        EXPORTER_PW="$$(cat /run/secrets/redis_exporter_password)"
        if [ -z "$$REDIS_PW" ]; then
          echo "FATAL: secrets/redis_password is empty. Run ./scripts/init-secrets.sh" >&2
          exit 1
        fi
        {
          printf 'requirepass %s\n' "$$REDIS_PW"
          printf 'user default on >%s ~* &* +@all\n' "$$REDIS_PW"
          printf 'user exporter on >%s ~* &* -@all +info +ping +client|setinfo +client|list +config|get +cluster|info +slowlog|get +latency|latest +memory|stats +command|docs\n' "$$EXPORTER_PW"
        } > /run/redis/auth.conf
        exec redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redisdata:/data
    tmpfs:
      # The rendered auth file lives in memory only. On a bind mount or a
      # volume it would survive the container and sit on the host disk in
      # plaintext.
      - /run/redis:mode=700
    secrets:
      - redis_password
      - redis_exporter_password
    healthcheck:
      # REDISCLI_AUTH rather than -a: the latter prints a warning containing
      # the password to stderr on every single probe, which lands in the
      # container logs. Grepping for PONG rather than trusting the exit code
      # because an unauthenticated ping can still exit 0 in some versions.
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Let the AOF finish flushing. appendfsync everysec means at most a second
    # of writes is outstanding, but a clean stop avoids an AOF rewrite on the
    # next start.
    stop_grace_period: 30s
    restart: unless-stopped

  backup:
    # postgres:16 rather than the pgvector image: this only needs client tools,
    # and the major version MUST match the server -- pg_dump refuses to dump a
    # server newer than itself. Bump both together.
    image: postgres:16-alpine
    entrypoint: ["/scripts/backup-scheduler.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: whatsapp_ai_bot
      PGPASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_DIR: /backups
      BACKUP_HOUR: "${BACKUP_HOUR:-2}"
      RETAIN_DAILY: "${RETAIN_DAILY:-14}"
      RETAIN_WEEKLY: "${RETAIN_WEEKLY:-8}"
      RETAIN_MONTHLY: "${RETAIN_MONTHLY:-12}"
      RESTORE_DRILL_ENABLED: "${RESTORE_DRILL_ENABLED:-true}"
      RESTORE_DRILL_DAYS: "${RESTORE_DRILL_DAYS:-7}"
      BACKUP_MAX_AGE_HOURS: "${BACKUP_MAX_AGE_HOURS:-30}"
      # --- Off-site replication (docs/OFFSITE_BACKUP.md) -------------------
      # Default 'none' keeps the stack working unchanged for anyone who has
      # not configured a provider yet; backup.sh logs a warning on every run
      # rather than failing.
      BACKUP_REMOTE_PROVIDER: "${BACKUP_REMOTE_PROVIDER:-none}"
      BACKUP_REMOTE_BUCKET: "${BACKUP_REMOTE_BUCKET:-}"
      BACKUP_REMOTE_PREFIX: "${BACKUP_REMOTE_PREFIX:-whatsapp-ai-bot}"
      BACKUP_REMOTE_MAX_AGE_HOURS: "${BACKUP_REMOTE_MAX_AGE_HOURS:-30}"
      BACKUP_REMOTE_RETRY_ATTEMPTS: "${BACKUP_REMOTE_RETRY_ATTEMPTS:-5}"
      RETAIN_REMOTE_DAILY: "${RETAIN_REMOTE_DAILY:-30}"
      RETAIN_REMOTE_WEEKLY: "${RETAIN_REMOTE_WEEKLY:-12}"
      RETAIN_REMOTE_MONTHLY: "${RETAIN_REMOTE_MONTHLY:-24}"
      BACKUP_S3_REGION: "${BACKUP_S3_REGION:-us-east-1}"
      BACKUP_S3_ENDPOINT: "${BACKUP_S3_ENDPOINT:-}"
      BACKUP_S3_STORAGE_CLASS: "${BACKUP_S3_STORAGE_CLASS:-}"
      BACKUP_GCS_PROJECT: "${BACKUP_GCS_PROJECT:-}"
      BACKUP_AZURE_ACCOUNT: "${BACKUP_AZURE_ACCOUNT:-}"
      # Credentials are read from Docker secrets via their _FILE variants.
      BACKUP_S3_ACCESS_KEY_ID_FILE: /run/secrets/backup_s3_access_key_id
      BACKUP_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_s3_secret_access_key
      BACKUP_GCS_CREDENTIALS_FILE: /run/secrets/backup_gcs_credentials
      BACKUP_AZURE_SAS_TOKEN_FILE: /run/secrets/backup_azure_sas_token
      BACKUP_ENCRYPTION_PASSPHRASE_FILE: /run/secrets/backup_encryption_passphrase
      BACKUP_AGE_RECIPIENT: "${BACKUP_AGE_RECIPIENT:-}"
      BACKUP_METRICS_DIR: /backups/metrics
    secrets:
      - postgres_password
      - backup_s3_access_key_id
      - backup_s3_secret_access_key
      - backup_gcs_credentials
      - backup_azure_sas_token
      - backup_encryption_passphrase
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Checks the AGE OF THE LAST SUCCESS, not whether the process is alive.
      # A backup container running happily while producing nothing for three
      # days is the failure that matters, and liveness cannot see it.
      test: ["CMD", "/scripts/backup-healthcheck.sh"]
      interval: 15m
      timeout: 30s
      retries: 2
      start_period: 2m
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-targets:/etc/prometheus/targets:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      prometheus-targets-init:
        condition: service_completed_successfully
      app:
        condition: service_started
      worker:
        condition: service_started
    restart: unless-stopped

  prometheus-targets-init:
    # Prometheus does NOT expand environment variables in its config file, so
    # the public probe target cannot be written inline -- ${DOMAIN} would be
    # scraped literally. Rendering a file_sd target file is the supported way
    # to get a deployment-specific value in.
    #
    # nginx:1.27-alpine purely because it already ships envsubst and is already
    # being pulled for the nginx service.
    image: nginx:1.27-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set, e.g. export DOMAIN=bot.example.com}
    volumes:
      - prometheus-targets:/out
    command:
      - /bin/sh
      - -c
      - |
        set -e
        printf '[{"targets":["https://%s/health"],"labels":{"probe":"public-health"}}]' "$$DOMAIN" > /out/blackbox.json
        echo "rendered blackbox targets for $$DOMAIN"
    restart: "no"

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - alertmanager-config:/etc/alertmanager
      - ./monitoring/templates:/etc/alertmanager/templates:ro
      - alertmanagerdata:/alertmanager
    # Alertmanager reads these itself, at notification time, via the *_file
    # form of each field in alertmanager.yml.tmpl. They are mounted here and
    # NOT on alertmanager-config: that container only renders the template and
    # has no need to see a credential in any form.
    secrets:
      - alert_smtp_password
      - alert_slack_webhook_url
      - alert_telegram_bot_token
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Required for silence links in notifications to be clickable.
      - --web.external-url=http://127.0.0.1:9093
    ports:
      # Loopback only. The silence UI has no authentication of its own, and an
      # exposed Alertmanager lets anyone silence every alert you have.
      - "127.0.0.1:9093:9093"
    depends_on:
      alertmanager-config:
        condition: service_completed_successfully
    restart: unless-stopped

  alertmanager-config:
    # Renders alertmanager.yml.tmpl. Alertmanager cannot expand environment
    # variables itself, so deployment-specific values are substituted here.
    #
    # NO CREDENTIALS. The SMTP password, Slack webhook URL and Telegram bot
    # token are Docker secrets mounted on the `alertmanager` service and read
    # by Alertmanager through the *_file fields, so they are neither in this
    # container's environment nor in the rendered file. Only hosts, ports,
    # channels, recipients and the chat id are substituted below.
    #
    # The envsubst variable list is EXPLICIT and must stay that way. A bare
    # `envsubst` also substitutes $labels and $value inside the Go notification
    # templates, silently emptying them -- producing alerts that arrive with no
    # detail in them, discovered during the first real incident.
    image: nginx:1.27-alpine
    environment:
      ALERT_SMTP_HOST: "${ALERT_SMTP_HOST:-}"
      ALERT_SMTP_PORT: "${ALERT_SMTP_PORT:-587}"
      ALERT_SMTP_USER: "${ALERT_SMTP_USER:-}"
      ALERT_EMAIL_FROM: "${ALERT_EMAIL_FROM:-}"
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:-}"
      ALERT_SLACK_CHANNEL: "${ALERT_SLACK_CHANNEL:-#alerts}"
      ALERT_SLACK_CHANNEL_BACKUP: "${ALERT_SLACK_CHANNEL_BACKUP:-${ALERT_SLACK_CHANNEL:-#alerts}}"
      ALERT_SLACK_CHANNEL_COST: "${ALERT_SLACK_CHANNEL_COST:-${ALERT_SLACK_CHANNEL:-#alerts}}"
      ALERT_TELEGRAM_CHAT_ID: "${ALERT_TELEGRAM_CHAT_ID:-0}"
    volumes:
      - ./monitoring/alertmanager.yml.tmpl:/tmpl/alertmanager.yml.tmpl:ro
      - alertmanager-config:/out
    command:
      - /bin/sh
      - -c
      - |
        set -e
        envsubst '$$ALERT_SMTP_HOST $$ALERT_SMTP_PORT $$ALERT_SMTP_USER $$ALERT_EMAIL_FROM $$ALERT_EMAIL_TO $$ALERT_SLACK_CHANNEL $$ALERT_SLACK_CHANNEL_BACKUP $$ALERT_SLACK_CHANNEL_COST $$ALERT_TELEGRAM_CHAT_ID' \
          < /tmpl/alertmanager.yml.tmpl > /out/alertmanager.yml
        echo "rendered /etc/alertmanager/alertmanager.yml"
    restart: "no"

  node-exporter:
    # Host CPU, memory, disk. Also the delivery path for the backup and
    # restore-drill metrics: scripts/backup-metrics.sh writes .prom files into
    # the backups volume and the textfile collector picks them up.
    image: prom/node-exporter:latest
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.textfile.directory=/backups/metrics
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - backups:/backups:ro
    expose:
      - "9100"
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_URI: "db:5432/whatsapp_ai_bot?sslmode=disable"
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    expose:
      - "9187"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis://redis:6379"
      # The restricted ACL account, not `default`. Read-only by construction:
      # if this container is compromised it cannot clear the rate limits,
      # spend counters or reply-idempotency keys.
      REDIS_USER: exporter
      REDIS_PASSWORD_FILE: /run/secrets/redis_exporter_password
    secrets:
      - redis_exporter_password
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  blackbox-exporter:
    # Probes the PUBLIC hostname from outside the app containers. Every other
    # target is scraped inside the compose network and would keep passing while
    # DNS, nginx or the certificate were broken -- which is precisely the
    # combination Meta needs to deliver a webhook.
    image: prom/blackbox-exporter:latest
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    expose:
      - "9115"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Grafana reads any setting from a file with the __FILE suffix.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  nginx:
    # Pinned. `nginx:alpine` floats across major versions, and a routine
    # `docker compose pull` on an unattended host should not be able to change
    # the TLS terminator's major version.
    image: nginx:1.27-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set, e.g. export DOMAIN=bot.example.com}
      # The image runs envsubst over everything in templates/. Without this
      # filter it would also substitute nginx's own runtime variables --
      # $host, $remote_addr, $proxy_add_x_forwarded_for -- replacing them with
      # empty strings. The result starts cleanly and proxies nonsense, which
      # is the worst kind of broken. Restrict substitution to DOMAIN only.
      NGINX_ENVSUBST_FILTER: "DOMAIN"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/tls.conf:/etc/nginx/tls.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    # Reload every 6 hours so a certificate renewed by certbot is actually
    # served. nginx reads its certificates once at startup: without this, a
    # renewal succeeds, the old certificate keeps being served, and the
    # problem surfaces 90 days later as an expiry outage. `nginx -g daemon off`
    # stays in the foreground as PID 1 so signals and `docker stop` behave.
    command: >-
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & 
      exec nginx -g 'daemon off;'"
    stop_grace_period: 30s
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Attempts renewal every 12 hours. Let's Encrypt asks for twice-daily
    # checks with a random delay so renewals spread across their fleet rather
    # than stampeding on the hour; `renew` is a no-op until a certificate is
    # inside its 30-day window, so this costs nothing the rest of the time.
    #
    # Renewal uses the webroot that nginx serves at
    # /.well-known/acme-challenge/, so no downtime and no port juggling.
    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"
    depends_on:
      - nginx
    restart: unless-stopped

secrets:
  database_url:
    file: ./secrets/database_url
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  redis_exporter_password:
    file: ./secrets/redis_exporter_password
  openai_api_key:
    file: ./secrets/openai_api_key
  whatsapp_token:
    file: ./secrets/whatsapp_token
  whatsapp_phone_number_id:
    file: ./secrets/whatsapp_phone_number_id
  whatsapp_verify_token:
    file: ./secrets/whatsapp_verify_token
  whatsapp_app_secret:
    file: ./secrets/whatsapp_app_secret
  admin_api_key:
    file: ./secrets/admin_api_key
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  # Off-site backup credentials. init-secrets.sh creates all of these as empty
  # files -- Docker refuses to start the stack if a declared secret file is
  # missing, so they must exist even when off-site backups are disabled.
  backup_s3_access_key_id:
    file: ./secrets/backup_s3_access_key_id
  backup_s3_secret_access_key:
    file: ./secrets/backup_s3_secret_access_key
  backup_gcs_credentials:
    file: ./secrets/backup_gcs_credentials
  backup_azure_sas_token:
    file: ./secrets/backup_azure_sas_token
  backup_encryption_passphrase:
    file: ./secrets/backup_encryption_passphrase
  # Firebase service-account JSON for push notifications. Same empty-placeholder
  # rule as the backup credentials above: re-run ./scripts/init-secrets.sh on an
  # existing host before deploying this file, or the stack will refuse to start
  # because ./secrets/fcm_credentials does not exist yet.
  fcm_credentials:
    file: ./secrets/fcm_credentials
  # Alerting credentials, read by Alertmanager itself through the *_file form
  # of each field. Same empty-placeholder rule again: init-secrets.sh creates
  # all three empty, which leaves the corresponding channel unconfigured
  # rather than breaking the stack. Fill in the ones you use --
  # see docs/ALERTING.md.
  alert_smtp_password:
    file: ./secrets/alert_smtp_password
  alert_slack_webhook_url:
    file: ./secrets/alert_slack_webhook_url
  alert_telegram_bot_token:
    file: ./secrets/alert_telegram_bot_token

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
  alertmanagerdata:
  # Rendered Alertmanager config. A volume rather than a bind mount so the
  # rendered file never touches the host filesystem. It no longer contains any
  # credential -- only the /run/secrets paths Alertmanager reads them from.
  alertmanager-config:
  # Rendered blackbox probe targets.
  prometheus-targets:
  # Certificates and ACME account keys. Survives `docker compose down`;
  # `down -v` destroys them and forces reissue against Let's Encrypt's rate
  # limits (5 duplicate certificates per week).
  certbot-conf:
  # ACME HTTP-01 challenge files, written by certbot and served by nginx.
  certbot-www:
  # Database dumps, plus the metrics/ directory node-exporter reads. Local
  # copies only -- off-site replication is configured separately, see
  # docs/OFFSITE_BACKUP.md.
  backups:
