# Redis production configuration.
#
# Loaded by docker-compose.prod.yml. The password is NOT here -- it lives in a
# Docker secret and is written to /run/redis/auth.conf at start-up by the
# service command, then pulled in by the `include` at the bottom of this file.
#
# Passing --requirepass on the command line instead would put the password in
# `ps` output inside the container and in `docker inspect` output outside it.

################################## NETWORK ####################################

bind 0.0.0.0
port 6379

# Protected mode refuses connections from outside the loopback interface when
# no password is set. With a password set it is not what is protecting us, but
# leaving it on means a misconfiguration that drops the password does not also
# silently drop the last line of defence.
protected-mode yes

# Close idle client connections after 5 minutes. Celery and the app both
# reconnect transparently.
timeout 300
tcp-keepalive 300

################################# PERSISTENCE #################################

# AOF: the reply-idempotency keys and spend counters are what stop a restart
# from re-billing and re-sending. RDB snapshots alone can lose the last minutes
# of writes, and those are exactly the minutes that matter after a crash.
appendonly yes
appendfsync everysec
dir /data

################################### MEMORY ####################################

# noeviction, deliberately.
#
# An LRU policy would let Redis silently evict quota counters and idempotency
# keys under pressure -- turning a memory problem into duplicate replies and an
# unenforced spend ceiling. Failing writes loudly is the safer failure.
maxmemory-policy noeviction

################################## SECURITY ###################################

# Dangerous commands.
#
# Renaming to an empty string disables a command entirely. These are destructive
# and nothing in this application issues them:
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command SHUTDOWN ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""
rename-command MODULE ""

# CONFIG is deliberately LEFT ENABLED.
#
# redis_exporter issues CONFIG GET to read maxmemory and other settings. With
# CONFIG disabled the exporter still starts and still reports redis_up, so
# nothing looks broken -- it just quietly stops publishing part of the metric
# set the alerts rely on. Authentication already prevents an unauthorised
# client from reaching it. If you remove the exporter, disable it here.
#
# KEYS is likewise left enabled: with auth in place it is a performance
# foot-gun rather than a security hole, and disabling it would break ad-hoc
# debugging with no attacker-facing benefit.

# ACL: a least-privilege user for the metrics exporter, which only ever needs
# to read server statistics. The application continues to use the default user.
# Requires Redis 6+.
user exporter on +client +ping +info +config|get +cluster|info +slowlog +latency +memory ~* >REPLACE_VIA_INCLUDE

################################### LIMITS ####################################

# Celery holds a connection per worker thread (concurrency 8) plus the app's
# pool plus the exporter. 10000 is the default and is not close to binding;
# stated explicitly so a future concurrency increase is a conscious decision.
maxclients 10000

#################################### LOGS #####################################

loglevel notice

############################## GENERATED AUTH #################################

# Written at container start from the Docker secret. Directives here override
# anything above, so this must remain the last line.
#
# If this file is missing Redis refuses to start. That is intentional: a Redis
# that starts without its password file would come up unauthenticated.
include /run/redis/auth.conf
