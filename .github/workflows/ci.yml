name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first. Without this, a busy
# branch queues runs that are already obsolete and the useful one waits behind
# them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Ratchet only. Raise it as coverage improves; never lower it to make a red
  # build green -- that converts the gate into decoration.
  COVERAGE_MIN: "50"

jobs:
  # ==========================================================================
  # Python static analysis
  # ==========================================================================
  lint:
    name: Lint (ruff, black, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Each step runs even if the previous failed, so one run reports every
      # problem instead of revealing them one commit at a time.
      - name: Ruff
        id: ruff
        if: always()
        run: ruff check --output-format=github .

      - name: Black
        id: black
        if: always()
        run: black --check --diff .

      - name: Mypy
        id: mypy
        if: always()
        run: mypy

  # ==========================================================================
  # Python dependency vulnerabilities
  # ==========================================================================
  python-security:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Pinned to the version the last green run resolved. This step used to
      # install with no constraint at all, inside the job whose whole purpose
      # is to keep dependency risk visible -- so the auditor itself could
      # change between two runs of the same commit, and a new release could
      # turn this job red without a line of this repository changing.
      #
      # Only pip-audit is pinned. Its transitive dependencies still resolve,
      # and the advisory database is fetched at run time in any case, so this
      # freezes the tool and not its findings.
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1

      - name: Audit runtime dependencies
        run: |
          pip-audit \
            --requirement requirements.txt \
            --desc \
            --format json \
            --output pip-audit.json \
            --progress-spinner off

      - name: Audit summary
        if: always()
        run: |
          pip-audit --requirement requirements.txt --desc --progress-spinner off \
            || echo "::warning::pip-audit reported vulnerabilities (see report)"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-${{ github.sha }}
          path: pip-audit.json
          if-no-files-found: ignore
          retention-days: 30

  # ==========================================================================
  # Secret scanning
  # ==========================================================================
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # On a pull_request event the action takes a different path from a push:
    # it calls GET /repos/{owner}/{repo}/pulls/{n}/commits to decide which
    # commits to scan. Without a pull-requests scope that call 403s and the
    # job dies before gitleaks runs, which reads as a failed secret scan and
    # is not one. Declaring this block replaces the default permission set
    # outright, so contents: read has to be restated for actions/checkout.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, which needs the full clone. With the
          # default shallow fetch it only ever sees the tip commit and a
          # credential committed and then removed goes unnoticed.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  # ==========================================================================
  # Tests
  # ==========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        # pgvector, not stock postgres: migration 0001 creates a vector column
        # and CREATE EXTENSION vector fails on the plain image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatsapp_ai_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        # Deliberately password-protected. Production Redis requires auth, so
        # testing against an open one would leave the credential-injection
        # path in app/config.py unexercised until deployment.
        options: >-
          --health-cmd "redis-cli -a ci-redis-password ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --entrypoint redis-server
        ports:
          - 6379:6379

    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/whatsapp_ai_bot_test
      REDIS_URL: redis://localhost:6379/0
      REDIS_PASSWORD: ci-redis-password
      OPENAI_API_KEY: sk-test
      WHATSAPP_TOKEN: test-token
      WHATSAPP_PHONE_NUMBER_ID: "1234567890"
      WHATSAPP_VERIFY_TOKEN: test-verify
      WHATSAPP_APP_SECRET: test-app-secret
      ADMIN_API_KEY: test-admin-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The service container runs redis-server with no arguments, so set the
      # password over the wire before anything connects.
      - name: Enable Redis authentication
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools
          redis-cli -h localhost -p 6379 CONFIG SET requirepass ci-redis-password
          REDISCLI_AUTH=ci-redis-password redis-cli -h localhost -p 6379 ping

      - name: Run migrations
        run: alembic upgrade head

      # -rs reports the reason for every skipped test. Without it a skip is a
      # bare number in the summary line and an intentional skip cannot be told
      # apart from a test that quietly stopped running.
      - name: Pytest
        run: |
          pytest \
            -rs \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --cov-fail-under=${{ env.COVERAGE_MIN }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: reports/junit.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            reports/coverage.xml
            reports/htmlcov
          if-no-files-found: warn
          retention-days: 30

  # ==========================================================================
  # Database migrations
  # ==========================================================================
  migrations:
    name: Migrations (fresh, upgrade, downgrade)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migration_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Fresh database: proves the migrations build the schema from nothing,
      # which is what a disaster recovery actually does. A chain that only
      # works against a database that already exists is not a recovery path.
      - name: Upgrade from empty database
        run: alembic upgrade head

      - name: Verify schema exists
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          for table in users conversations messages; do
            psql -h localhost -U postgres -d migration_test \
              -tAc "SELECT to_regclass('public.$table')" | grep -q "$table" || {
                echo "::error::table $table missing after upgrade"; exit 1; }
          done
          psql -h localhost -U postgres -d migration_test \
            -tAc "SELECT 1 FROM pg_extension WHERE extname='vector'" | grep -q 1 || {
              echo "::error::pgvector extension not installed by migrations"; exit 1; }

      # Downgrade is the step nobody runs until a rollback during an incident,
      # which is the worst possible moment to discover a missing downgrade().
      - name: Downgrade to base
        run: alembic downgrade base

      - name: Upgrade again
        run: alembic upgrade head

  # ==========================================================================
  # Frontend
  # ==========================================================================
  frontend:
    name: Dashboard (build, types, lint, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # npm ci, not npm install: it installs exactly what
      # dashboard/package-lock.json pins, and fails instead of resolving newer
      # versions inside the caret ranges when the lockfile and package.json
      # have drifted apart. That failure is the useful signal -- it means
      # package.json was edited without the lockfile being regenerated.
      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation
        run: npx tsc --noEmit

      # Every version is exact. Three of these used to be installed with no
      # constraint at all and two with a range, inside the very job that
      # enforces npm ci everywhere else -- so the linter that gates the
      # dashboard could change under the repository between two runs of the
      # same commit.
      #
      # These are the versions the ranges resolved to on the last green run,
      # so this freezes a known-good set rather than adopting a new one:
      # eslint@9 and @eslint/js@^9.0.0 both resolved to 9.39.5, the current
      # 9.x maintenance line, and the three unconstrained packages to their
      # then-latest. eslint.config.js is a flat config written against the
      # ESLint 9 API; moving to the 10.x line is a separate change with its
      # own review.
      #
      # They stay out of package.json on purpose. npm ci must keep installing
      # exactly the lockfile, and the lint tooling is not a dashboard runtime
      # dependency -- pinning here is what makes this step reproducible.
      - name: Lint
        run: |
          npm install --no-save --no-audit --no-fund \
            eslint@9.39.5 \
            @eslint/js@9.39.5 \
            typescript-eslint@8.66.0 \
            eslint-plugin-react-hooks@7.1.1 \
            eslint-plugin-react-refresh@0.5.3
          npx eslint .

      - name: Build
        run: npm run build 2>&1 | tee ../frontend-build.log

      - name: npm audit
        # Moderate advisories in the Vite toolchain are routine and are not
        # shipped to users -- the build output is static files. Fail on high
        # and critical, which are the ones worth blocking a release for.
        run: npm audit --audit-level=high

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log-${{ github.sha }}
          path: frontend-build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist-${{ github.sha }}
          path: dashboard/dist
          if-no-files-found: warn
          retention-days: 7

  # ==========================================================================
  # Mobile
  # ==========================================================================
  mobile:
    name: Flutter (codegen, analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      # Pinned to a channel rather than a version, which is the weaker choice
      # and is deliberate. pubspec.yaml constrains intl to ^0.20.2 and records
      # that analyzer >=6.6.0 needs a _macros package the SDK no longer ships,
      # so the floor is a recent stable -- but the repository does not record
      # which one, and pinning a version nobody has resolved against would
      # trade a floating dependency for a red job. Pin it once a green run has
      # named a version.
      #
      # This carries more weight now than it used to. The analyze step below
      # is zero-tolerance, so a new stable that adds a lint or deprecates a
      # member can turn this job red without a line of this repository
      # changing. That is a real risk of the clean gate and it is recorded
      # here rather than pre-emptively absorbed by loosening the gate.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # The step this job exists for. freezed and json_serializable output is
      # not committed, so mobile/ does not compile from a clean checkout until
      # this runs -- and a @freezed model that gains a field without its
      # generated code being regenerated fails here rather than on the next
      # person's laptop.
      #
      # --delete-conflicting-outputs is required, not decorative: a stale
      # .g.dart from an earlier run otherwise blocks the build with a conflict
      # instead of being replaced.
      #
      # Reads mobile/build.yaml, which renames every JSON field to snake_case
      # to match the API. Without it the generated fromJson looks for camelCase
      # keys the backend never sends.
      - name: Generate code
        id: codegen
        run: dart run build_runner build --delete-conflicting-outputs

      # No suppression flags, and none are coming back.
      #
      # This step used to run with --no-fatal-infos and --no-fatal-warnings,
      # under a comment recording that the app reported 171 issues -- 154
      # infos and 17 warnings, no errors -- and that the gate was deliberately
      # narrowed to errors because that backlog was not going to be cleared
      # in passing. It has since been cleared: the analyzer reports zero
      # issues against mobile/analysis_options.yaml, which is unchanged and
      # still enables prefer_const_constructors, require_trailing_commas,
      # avoid_print, strict-casts and strict-raw-types on top of
      # flutter_lints.
      #
      # So an info is fatal again, which is the entire point. If this step
      # goes red, fix the finding. Adding a flag back, an exclusion, or an
      # ignore_for_file would restore the situation this replaced: a green
      # check that means nothing.
      - name: Analyze
        run: flutter analyze

      # Gated on codegen rather than on Analyze, so an analyzer finding cannot
      # hide a genuine test failure behind it -- which has happened here: an
      # analyzer failure once masked a real widget-test failure, and the two
      # were only separated by running them independently. The Python lint job
      # runs ruff, black and mypy the same way. The job still fails if either
      # step fails.
      #
      # The guard that used to live here skipped the suite whenever
      # mobile/test/ was empty, and its own comment said to delete it with the
      # first test. Done -- the suite is required now.
      - name: Test
        if: always() && steps.codegen.outcome == 'success'
        run: flutter test --reporter expanded --coverage

      - name: Upload Flutter coverage
        if: always() && steps.codegen.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ github.sha }}
          path: mobile/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30

  # ==========================================================================
  # Docker
  # ==========================================================================
  docker:
    name: Docker (build, compose, Trivy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: whatsapp-ai-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Validates BOTH compose files. This is the check that would have caught
      # the earlier bug where a bind mount pointed at a file that did not
      # exist: Docker silently creates a DIRECTORY in its place, and the
      # service starts and misbehaves rather than failing.
      - name: Validate dev compose
        run: docker compose -f docker-compose.yml config -q

      - name: Validate production compose
        env:
          DOMAIN: ci.example.com
        run: |
          set -e
          # Compose refuses to evaluate a file whose declared secret sources do
          # not exist, so create a placeholder for each one. The names are read
          # out of the compose file itself rather than restated here.
          #
          # The comment that used to sit here claimed this doubled as a check
          # that the compose file and scripts/init-secrets.sh agree. It never
          # did: `config -q` does not look at a secret's file at all, so the
          # hard-coded list drifted four names behind the compose file and this
          # step stayed green throughout. That comparison now lives in
          # tests/test_secret_wiring.py, which fails the Tests job when the two
          # disagree -- and which also checks that only Alertmanager receives
          # the alert_* credentials.
          names="$(awk '
            /^secrets:/ { inblock = 1; next }
            inblock && /^[^[:space:]]/ { inblock = 0 }
            inblock && /^  [a-z]/ { sub(/:.*/, ""); sub(/^  /, ""); print }
          ' docker-compose.prod.yml)"
          test -n "$names" || {
            echo "::error::no secrets parsed from docker-compose.prod.yml"
            exit 1
          }
          count=$(echo "$names" | wc -l)
          mkdir -p secrets
          for name in $names; do
            printf 'ci-placeholder' > "secrets/$name"
          done
          echo "created $count secret placeholders"
          docker compose -f docker-compose.prod.yml config -q
          echo "production compose is valid"

      - name: Verify monitoring config files exist
        # Every bind-mounted config in the prod compose must be a real file.
        # A missing one becomes a directory at runtime and the container fails
        # in a way that looks like a config syntax error.
        run: |
          set -e
          for f in \
            monitoring/prometheus.yml \
            monitoring/alerts.yml \
            monitoring/alertmanager.yml.tmpl \
            monitoring/blackbox.yml \
            redis/redis.conf \
            nginx/tls.conf \
            nginx/security-headers.conf
          do
            test -f "$f" || { echo "::error::missing bind-mount source: $f"; exit 1; }
          done
          test -d monitoring/templates || {
            echo "::error::missing monitoring/templates directory"; exit 1; }
          echo "all bind-mount sources present"

      - name: Validate Prometheus rules and config
        run: |
          set -e
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool \
            prom/prometheus:latest check rules /m/alerts.yml

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: whatsapp-ai-bot:ci
          format: table
          # HIGH and CRITICAL both fail the build.
          #
          # This was CRITICAL-only, on the argument that failing on every HIGH
          # in a Debian base image would break every build for reasons no
          # change in this repository can fix, and that a pipeline which is
          # always red is one everybody learns to ignore. That argument is
          # answered by ignore-unfixed, which was already set: only
          # vulnerabilities with a fix available can fail this step. A HIGH
          # therefore blocks the build exactly when rebuilding on a patched
          # base image would clear it, which is an action this repository can
          # take -- and an unfixable one still cannot wedge the pipeline.
          #
          # Nothing is suppressed to achieve that. Unfixed findings are kept
          # out of the GATE, not out of sight: the informational scan below
          # runs every severity without ignore-unfixed and uploads the result.
          #
          # If a fixable HIGH ever appears that genuinely cannot be cleared by
          # a base-image bump, record the CVE and the reason here rather than
          # widening this back to CRITICAL.
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy report (informational, all severities)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: whatsapp-ai-bot:ci
          format: json
          output: trivy-report.json
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-report.json
          if-no-files-found: ignore
          retention-days: 30

  # ==========================================================================
  # Publish
  # ==========================================================================
  build:
    name: Publish image
    runs-on: ubuntu-latest
    # `mobile` is deliberately absent. The image contains the API and the
    # dashboard build; no Flutter output ships in it, so blocking a backend
    # release on the mobile app would couple two things that do not deploy
    # together.
    needs: [test, migrations, frontend, docker, secret-scan, python-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Deploy
  # ==========================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
                echo "health check passed"
                exit 0
              fi
              echo "health check attempt $i failed; retrying"
              sleep 10
            done
            echo "deployment failed health checks"
            exit 1
